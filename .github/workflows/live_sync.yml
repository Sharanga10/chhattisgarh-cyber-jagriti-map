name: Scheduled Telemetry Sync

on:
  schedule:
    # Run every 10 minutes (GitHub minimum is 5 min, 10 min provides stable execution)
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Cache Events Database
        uses: actions/cache@v4
        with:
          path: events.db
          key: events-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            events-db-${{ runner.os }}-

      - name: Execute one-time stealth sync
        run: |
          python3 live_sync_daemon.py --once

      - name: Commit and push updates
        run: |
          git config user.name "GitHub Action [Bot]"
          git config user.email "actions@github.com"
          git add live_feed.json index.html chhattisgarh_cyber_jagriti_map.html
          git diff --staged --quiet || (git commit -m "Auto-sync telemetry [$(date -u +'%Y-%m-%d %H:%M:%S UTC')]" && git pull --rebase --autostash origin main && git push)
