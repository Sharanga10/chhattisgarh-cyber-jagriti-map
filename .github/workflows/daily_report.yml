name: Daily Cyber Jagriti Report & Data Audit Dispatch

on:
  schedule:
    - cron: '0 17 * * *' # Daily at 17:00 UTC (10:30 PM IST)
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions UI

jobs:
  audit-and-report:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: |
          playwright install chromium

      - name: Sync Telemetry & Run Data Audit Agent
        run: |
          python3 live_sync_daemon.py --once
          python3 data_audit_agent.py

      - name: Generate Audited Comprehensive PDF Report
        run: |
          python3 generate_comprehensive_report.py
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}

      - name: Generate Audited Top 10 Districts Report
        run: |
          python3 generate_top10_report.py

      - name: Export Full Ground Truth Events Data
        run: |
          python3 export_ground_truth_all.py

      - name: Commit Updated Master CSV, Database & Report Artifacts
        run: |
          git config user.name "GitHub Action [Bot]"
          git config user.email "actions@github.com"
          git add live_feed.json index.html chhattisgarh_cyber_jagriti_map.html cyber_jagriti_all_events.csv events.db reports/ audit_results.json || true
          git diff --staged --quiet || (git commit -m "Auto-generated Daily Audited Report & Data Export [$(date -u +'%Y-%m-%d %H:%M:%S UTC')]" && git push)
